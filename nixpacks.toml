# Railway Nixpacks Configuration
[phases.setup]
nixPkgs = ["nodejs_20", "python310", "python310Packages.pip", "libsndfile"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m pip install -r requirements.txt --break-system-packages || python3 -m pip install fastapi uvicorn websockets pydantic numpy requests || true"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"
